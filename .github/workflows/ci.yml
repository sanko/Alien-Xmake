---
jobs:

  freebsd:
    name: FreeBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '15.0'
      task: |
        perl -V
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere
        #~ (Solaris/OmniOS site bin), so re-export those dirs first.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl App::cpanminus
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        #~ Alien::Xmake probes `cc` first, then gcc/clang: point /usr/bin/cc at
        #~ the real gcc when there is no /usr/bin/cc.
        gcc_path=$(command -v gcc 2>/dev/null || true)
        if [ -n "$gcc_path" ] && [ ! -e /usr/bin/cc ]; then ln -sf "$gcc_path" /usr/bin/cc 2>/dev/null || true; fi
        echo "cc=$(command -v cc || true) gcc=$(command -v gcc || true) make=$(command -v make || true) gmake=$(command -v gmake || true)"
        echo 'int main(){return 0;}' | cc -xc - -o /dev/null - 2>/dev/null && echo 'cc compile OK' || echo 'cc compile FAILED'
        command -v cpanm
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL
        cpanm -v .
      #~ No X11 in base: install the dev libs so xmake uses the system pkg tools
      #~ instead of bootstrapping the whole X11 stack from source.
      matrix: >
        [
          {"platform_name":"freebsd","os":"freebsd","arch":"x86_64","toolchain":"gcc","prepare":"pkg install -y perl5 lang/gcc libX11 libxcb libXext libXfixes libXcursor libXrandr libXi libXrender libXScrnSaver libxkbcommon wayland xorgproto pkgconf curl gmake"},
          {"platform_name":"freebsd","os":"freebsd","arch":"x86_64","toolchain":"clang","prepare":"pkg install -y perl5 llvm libX11 libxcb libXext libXfixes libXcursor libXrandr libXi libXrender libXScrnSaver libxkbcommon wayland xorgproto pkgconf curl gmake"}
        ]

  netbsd:
    name: NetBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '10.1'
      task: |
        perl -V
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere
        #~ (Solaris/OmniOS site bin), so re-export those dirs first.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl App::cpanminus
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        #~ Alien::Xmake probes `cc` first, then gcc/clang: point /usr/bin/cc at
        #~ the real gcc when there is no /usr/bin/cc.
        gcc_path=$(command -v gcc 2>/dev/null || true)
        if [ -n "$gcc_path" ] && [ ! -e /usr/bin/cc ]; then ln -sf "$gcc_path" /usr/bin/cc 2>/dev/null || true; fi
        echo "cc=$(command -v cc || true) gcc=$(command -v gcc || true) make=$(command -v make || true) gmake=$(command -v gmake || true)"
        echo 'int main(){return 0;}' | cc -xc - -o /dev/null - 2>/dev/null && echo 'cc compile OK' || echo 'cc compile FAILED'
        command -v cpanm
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL
        cpanm -v .
      matrix: >
        [
          {"platform_name":"netbsd","os":"netbsd","arch":"x86_64","toolchain":"gcc","prepare":"/usr/sbin/pkg_add perl curl gmake"}
        ]

  dragonflybsd:
    name: DragonFly BSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '6.4.0'
      task: |
        perl -V
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere
        #~ (Solaris/OmniOS site bin), so re-export those dirs first.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl App::cpanminus
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        #~ Alien::Xmake probes `cc` first, then gcc/clang: point /usr/bin/cc at
        #~ the real gcc when there is no /usr/bin/cc.
        gcc_path=$(command -v gcc 2>/dev/null || true)
        if [ -n "$gcc_path" ] && [ ! -e /usr/bin/cc ]; then ln -sf "$gcc_path" /usr/bin/cc 2>/dev/null || true; fi
        echo "cc=$(command -v cc || true) gcc=$(command -v gcc || true) make=$(command -v make || true) gmake=$(command -v gmake || true)"
        echo 'int main(){return 0;}' | cc -xc - -o /dev/null - 2>/dev/null && echo 'cc compile OK' || echo 'cc compile FAILED'
        command -v cpanm
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL
        cpanm -v .
      matrix: >
        [
          {"platform_name":"dragonflybsd","os":"dragonflybsd","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"pkg update && pkg upgrade -y && pkg install -y perl5 gcc curl gmake libunistring"}
        ]

  solaris:
    name: Solaris
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '11.4'
      task: |
        perl -V
        #~ Bootstrap cpanm via a file download, never `curl | perl`: some remote
        #~ sh's run under pipefail, and curl's EPIPE (23) after a clean pipe
        #~ install aborts the whole run even though it succeeded. cpanm lands in
        #~ the active perl's sitebin/scriptdir, which is not on PATH everywhere
        #~ (Solaris/OmniOS site bin), so re-export those dirs first.
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl App::cpanminus
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):$PATH"
        #~ Alien::Xmake probes `cc` first, then gcc/clang: point /usr/bin/cc at
        #~ the real gcc when there is no /usr/bin/cc.
        gcc_path=$(command -v gcc 2>/dev/null || true)
        if [ -n "$gcc_path" ] && [ ! -e /usr/bin/cc ]; then ln -sf "$gcc_path" /usr/bin/cc 2>/dev/null || true; fi
        echo "cc=$(command -v cc || true) gcc=$(command -v gcc || true) make=$(command -v make || true) gmake=$(command -v gmake || true)"
        echo 'int main(){return 0;}' | cc -xc - -o /dev/null - 2>/dev/null && echo 'cc compile OK' || echo 'cc compile FAILED'
        command -v cpanm
        export XMAKE_ROOT=y
        cpanm --notest IO::Socket::SSL
        cpanm -v .
      matrix: >
        [
          {"platform_name":"solaris","os":"solaris","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5","prepare":"pkg install -v --accept perl-538 gcc developer/build/make bash"}
        ]

  linux:
    name: Linux
    secrets: inherit
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      matrix: |
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3","configure":"-Duselongdouble","variant":"longdoubles"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"clang","perl_version":"5.40.5"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"clang","perl_version":"5.40.5"}
        ]
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
  macos:
    name: macOS
    secrets: inherit
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      matrix: |
        [
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"clang","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"clang","perl_version":"5.42.3"}
        ]
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
  results:
    if: always()
    name: Summary
    needs:
      - linux
      - macos
      - windows
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
  windows:
    name: Windows
    secrets: inherit
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      matrix: |
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"gcc","prepare":"choco install strawberryperl"},
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"gcc","variant":"bare","prepare":"choco install strawberryperl; for d in '/c/Program Files/Microsoft Visual Studio/'*; do [ -d \"$d\" ] && mv \"$d\" \"$d.disabled\" || true; done; w='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'; [ -f \"$w\" ] && mv \"$w\" \"$w.disabled\" || true; s='/c/ProgramData/Chocolatey/bin/vswhere.exe'; [ -f \"$s\" ] && mv \"$s\" \"$s.disabled\" || true; reg delete 'HKLM\\SOFTWARE\\Microsoft\\VisualStudio\\SxS\\VS7' /f >/dev/null 2>&1 || true; reg delete 'HKLM\\SOFTWARE\\WOW6432Node\\Microsoft\\VisualStudio\\SxS\\VS7' /f >/dev/null 2>&1 || true; for l in '/c/Program Files/LLVM' '/c/msys64' '/c/mingw64'; do [ -d \"$l\" ] && mv \"$l\" \"$l.disabled\" || true; done; echo 'Post-scrub Visual Studio roots:'; ls -1 '/c/Program Files/Microsoft Visual Studio/' 2>/dev/null || echo 'no VS dir'; echo '=== PROBE: what does the bundled xmake detect after the scrub? ==='; export PATH=\"/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH\"; for v in VS160COMNTOOLS VS170COMNTOOLS VS180COMNTOOLS VS190COMNTOOLS VCINSTALLDIR; do vv=\"${!v:-<unset>}\"; echo \"  __ $v = $vv\"; done; echo '-- compiler-ish tools on PATH --'; for t in gcc g++ cc cl clang vswhere; do printf '%-10s %s\\n' \"$t\" \"$(command -v $t 2>/dev/null || echo MISSING)\"; done; echo \"-- gcc -- $(command -v gcc 2>/dev/null || echo MISSING) ( $(gcc --version 2>/dev/null | head -1) )\"; set +e; cand=\"$GITHUB_WORKSPACE/share/xmake.exe\"; [ -f \"$cand\" ] || cand=\"$(pwd)/share/xmake.exe\"; xs=\"$(cygpath -w \"$cand\" 2>/dev/null || echo \"$cand\")\"; echo \"-- xmake: $xs (v$(perl -e 'system(@ARGV); exit($?>>8)' \"$xs\" --version 2>/dev/null | head -1)) --\"; pdir=\"$(cygpath -u \"${TEMP:-/tmp}/xmake-probe\" 2>/dev/null || echo /tmp/xmake-probe)\"; rm -rf \"$pdir\" 2>/dev/null; mkdir -p \"$pdir\" || { echo 'probe mkdir failed'; exit 0; }; cd \"$pdir\" || exit 0; echo '-- raw version --'; perl -e 'system(@ARGV); exit($?>>8)' \"$xs\" --version > ver.out 2>&1; echo \"ver exit=$?\"; cat ver.out 2>/dev/null | sed 's/\\x1b\\[[0-9;]*m//g' || true; echo '-- probe.lua (find_vstudio + find_tool) --'; printf '%s\\n' 'import(\"detect.sdks.find_vstudio\")' 'local vs = find_vstudio({})' 'if vs then for k,v in pairs(vs) do print(\"vstudio:\", k, type(v)==\"table\" and tostring(v.version) or tostring(v)) end else print(\"vstudio: NOT FOUND\") end' 'local t = import(\"lib.detect.find_tool\")' 'for _,n in ipairs({\"cl\",\"clang\",\"clang-cl\",\"cc\",\"gcc\",\"vswhere\"}) do local r = t(n) print(\"tool\", n, r and r.program or \"MISSING\") end' > probe.lua; perl -e 'system(@ARGV); exit($?>>8)' \"$xs\" l probe.lua 2>&1 | sed 's/\\x1b\\[[0-9;]*m//g' || true; echo '-- raw vswhere --'; vswhere -nologo -all -format text -property installationPath 2>&1 | sed 's/\\x1b\\[[0-9;]*m//g' || true; echo '-- minimal console project --'; mkdir -p src; printf '%s\\n' 'add_rules(\"mode.debug\", \"mode.release\")' 'target(\"t\")' '    set_kind(\"binary\")' '    add_files(\"src/*.c\")' > xmake.lua; printf '%s\\n' 'int main() { return 0; }' > src/main.c; echo '-- xmake f -p windows -m debug -v -D --'; perl -e 'system(@ARGV); exit($?>>8)' \"$xs\" f -p windows -m debug -v -D > f.out 2>&1; fexit=$?; sed 's/\\x1b\\[[0-9;]*m//g' f.out || true; echo \"-- f exit was $fexit --\"; echo '-- xmake build -v -D --'; perl -e 'system(@ARGV); exit($?>>8)' \"$xs\" build -v -D > b.out 2>&1; bexit=$?; sed 's/\\x1b\\[[0-9;]*m//g' b.out || true; echo \"-- b exit was $bexit --\"; echo '=== PROBE DONE ==='; exit 0"},
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"clang","prepare":"choco install llvm strawberryperl"},
          {"platform_name":"windows-arm","os":"windows-11-arm","arch":"aarch64","toolchain":"gcc","prepare":"choco install make -y; curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54051_64bit/strawberry-perl-5.40.5.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip && ln -sf /c/Strawberry/c/bin/gcc.exe /c/Strawberry/c/bin/cc.exe"}
        ]
      task: |
        export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -e 'print qq(perl=\$^X :: \$^O\n)'
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
name: CI
on:
  pull_request: ~
  push:
    branches:
      - main
      - dev
      - dev-repair
  workflow_dispatch: ~
permissions:
  actions: read
  contents: read
